name: Update Portfolio Status

on:
  schedule:
    # Rulează automat în fiecare zi la miezul nopții
    - cron: '0 0 * * *'
  workflow_dispatch: # Îți permite să pornești scriptul manual oricând vrei, din tab-ul Actions

# Îi dă dreptul scriptului să modifice fișierele din repository (cum e README.md)
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Project Stats by Emoji Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Înlocuiește 'deeanop' cu username-ul tău exact de GitHub dacă este diferit
          USERNAME="deeanop"

          # Scanează descrierile după formatul tău exact cu emoji
          FINISHED=$(gh repo list $USERNAME --json description --jq '[.[] | select(.description // "" | contains("🟢 Finished"))] | length')
          PROGRESS=$(gh repo list $USERNAME --json description --jq '[.[] | select(.description // "" | contains("🟡 In progess"))] | length')
          UNDER_CONSTRUCTION=$(gh repo list $USERNAME --json description --jq '[.[] | select(.description // "" | contains("⚠️ Under construction"))] | length')
          PLANNED=$(gh repo list $USERNAME --json description --jq '[.[] | select(.description // "" | contains("🔴 Planned"))] | length')
          
          # Generează tabelul curat în format Markdown (folosim \n pentru rânduri noi)
          # Notă: În tabelul final am corectat vizual textul în "In Progress", dar căutarea rămâne pe textul tău
          TABEL="### 📊 Project Portfolio Status\n\n| Status | Total Projects |\n| :--- | :---: |\n| 🟢 Finished | **$FINISHED** |\n| 🟡 In Progress | **$PROGRESS** |\n| ⚠️ Under Construction | **$UNDER_CONSTRUCTION** |\n| 🔴 Planned | **$PLANNED** |"
          
          # Șterge tot ce era vechi între ancore și injectează noul tabel
          sed -i "/<!-- START_SECTION:portfolio_status -->/,/<!-- END_SECTION:portfolio_status -->/ {//!d}" README.md
          sed -i "/<!-- START_SECTION:portfolio_status -->/a $TABEL" README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # Verifică dacă s-a schimbat ceva (ca să nu facă commit-uri degeaba dacă numărul e același)
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated portfolio status stats" && git push)
