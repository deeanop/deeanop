name: Update Portfolio Status

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Project Stats by Emoji Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USERNAME="deeanop"
          
          # Forțăm sistemul să recunoască corect caracterele text
          export LANG=C.UTF-8

          # AM ADĂUGAT --limit 1000! Acum va scana toate proiectele tale.
          # Căutăm doar cuvintele cheie importante, fără emoji, ca să nu existe erori de citire.
          FINISHED=$(gh repo list $USERNAME --limit 1000 --json description --jq '[.[] | select(.description // "" | ascii_downcase | contains("finished"))] | length')
          PROGRESS=$(gh repo list $USERNAME --limit 1000 --json description --jq '[.[] | select(.description // "" | ascii_downcase | contains("prog"))] | length')
          UNDER_CONSTRUCTION=$(gh repo list $USERNAME --limit 1000 --json description --jq '[.[] | select(.description // "" | ascii_downcase | contains("construction"))] | length')
          PLANNED=$(gh repo list $USERNAME --limit 1000 --json description --jq '[.[] | select(.description // "" | ascii_downcase | contains("planned"))] | length')
          FORKED=$(gh repo list $USERNAME --limit 1000 --json description --jq '[.[] | select(.description // "" | ascii_downcase | contains("forked"))] | length')                                               
          
          # Generează tabelul curat în format Markdown
          TABEL="### 📊 Project Portfolio Status\n\n| Status | Total Projects |\n| :--- | :---: |\n| 🟢 Finished | **$FINISHED** |\n| 🟡 In Progress | **$PROGRESS** |\n| ⚠️ Under Construction | **$UNDER_CONSTRUCTION** |\n| 🔴 Planned | **$PLANNED** |\n| 🔵 Forked | **$FORKED** |"
          
          # Șterge tot ce era vechi între ancore și injectează noul tabel
          sed -i "/<!-- START_SECTION:portfolio_status -->/,/<!-- END_SECTION:portfolio_status -->/ {//!d}" README.md
          sed -i "/<!-- START_SECTION:portfolio_status -->/a $TABEL" README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # Verifică dacă s-a schimbat ceva
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated portfolio status stats" && git push)
